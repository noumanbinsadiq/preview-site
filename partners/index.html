<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('blob').textContent);
function b64(s){var raw=atob(s),a=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);return a;}
async function open_(pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.iters,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct));
  return new TextDecoder().decode(plain);
}
/* ⛔ NEVER document.open()/write() here — Chrome tears down the running script and
   the payload truncates. DOMParser + adoptNode, then re-create every <script>. */
function swap(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  document.title=doc.title||document.title;
  while(document.head.firstChild) document.head.removeChild(document.head.firstChild);
  while(document.body.firstChild) document.body.removeChild(document.body.firstChild);
  Array.prototype.slice.call(doc.head.childNodes).forEach(function(n){document.head.appendChild(document.adoptNode(n));});
  Array.prototype.slice.call(doc.body.childNodes).forEach(function(n){document.body.appendChild(document.adoptNode(n));});
  document.documentElement.setAttribute('lang',doc.documentElement.getAttribute('lang')||'en');
  Array.prototype.slice.call(document.querySelectorAll('script')).forEach(function(old){
    var s=document.createElement('script');
    Array.prototype.slice.call(old.attributes).forEach(function(a){s.setAttribute(a.name,a.value);});
    s.textContent=old.textContent;
    old.parentNode.replaceChild(s,old);
  });
  window.scrollTo(0,0);
}
var f=document.getElementById('f'),p=document.getElementById('p'),e=document.getElementById('e'),b=document.getElementById('b');
async function attempt(pw,quiet){
  b.disabled=true;e.textContent=quiet?'':'Opening…';
  try{ var html=await open_(pw); try{sessionStorage.setItem('pp_k',pw);}catch(_){} swap(html); }
  catch(err){ try{sessionStorage.removeItem('pp_k');}catch(_){} b.disabled=false;
    if(!quiet){e.textContent='That passcode does not open this document.';p.value='';p.focus();} else e.textContent=''; }
}
f.addEventListener('submit',function(ev){ev.preventDefault();if(p.value)attempt(p.value,false);});
try{var k=sessionStorage.getItem('pp_k');if(k)attempt(k,true);}catch(_){}
p.focus();
})();
</script>
