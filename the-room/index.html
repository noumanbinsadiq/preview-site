<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0B0B09;color:#F2EFE9;

.card{position:relative;width:100%;max-width:400px;text-align:left}
.mark{display:flex;align-items:center;gap:.7rem;margin-bottom:2.75rem}

.sub{color:#8F8C84;font-size:1.0625rem;line-height:1.7;margin:0 0 2.5rem;max-width:34ch}
label{display:block;font-family:'Space Mono',ui-monospace,monospace;font-size:.625rem;
  letter-spacing:.14em;text-transform:uppercase;color:#7E7A72;margin-bottom:.7rem}
.row{display:flex;gap:.6rem;align-items:stretch}
input{flex:1;min-width:0;background:#131311;border:1px solid rgba(242,239,233,.12);border-radius:2px;

  padding:.95rem 1rem;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}

button{flex:0 0 auto;background:#C9A84C;color:#0B0B09;border:0;border-radius:2px;cursor:pointer;
  font-family:'Space Mono',ui-monospace,monospace;font-size:.6875rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;padding:0 1.35rem;transition:background .2s}
button:hover:not(:disabled){background:#F0C36A}
button:disabled{opacity:.45;cursor:default}
.msg{margin-top:1rem;min-height:1.2rem;font-family:'Space Mono',ui-monospace,monospace;
  font-size:.6875rem;letter-spacing:.08em;color:#7E7A72}
.msg.err{color:#F0C36A}
.foot{margin-top:3.25rem;padding-top:1.4rem;border-top:1px solid rgba(242,239,233,.12);
  font-family:'Space Mono',ui-monospace,monospace;font-size:.625rem;letter-spacing:.12em;
  text-transform:uppercase;color:#7E7A72;line-height:2}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:nudge .28s ease}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
noscript{display:block;color:#8F8C84;font-size:.9375rem;line-height:1.7;margin-top:1.5rem}

      b=document.getElementById('b'),m=document.getElementById('m'),card=document.querySelector('.card');
  var KEY='sl.k';

  function bin(s){var r=atob(s),a=new Uint8Array(r.length);for(var j=0;j<r.length;j++)a[j]=r.charCodeAt(j);return a}

  function open_(html){
    var d=new DOMParser().parseFromString(html,'text/html');
    document.documentElement.className=d.documentElement.className||'';
    var lang=d.documentElement.getAttribute('lang'); if(lang)document.documentElement.setAttribute('lang',lang);
    while(document.head.firstChild) document.head.removeChild(document.head.firstChild);
    while(document.body.firstChild) document.body.removeChild(document.body.firstChild);
    var n;
    while((n=d.head.firstChild)) document.head.appendChild(document.adoptNode(n));
    while((n=d.body.firstChild)) document.body.appendChild(document.adoptNode(n));
    var t=document.querySelector('title'); if(t) document.title=t.textContent;
    var olds=Array.prototype.slice.call(document.querySelectorAll('script'));
    for(var k=0;k<olds.length;k++){
      var o=olds[k], s=document.createElement('script');
      for(var a=0;a<o.attributes.length;a++) s.setAttribute(o.attributes[a].name,o.attributes[a].value);
      s.textContent=o.textContent;
      o.parentNode.replaceChild(s,o);
    }
    window.scrollTo(0,0);
  }

  async function unlock(pw,quiet){
    var C=window.crypto&&window.crypto.subtle;
    if(!C){m.className='msg err';m.textContent='This browser cannot open it. Try Chrome or Safari.';return false}
    try{
      var base=await C.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      var key=await C.deriveKey({name:'PBKDF2',salt:bin(P.s),iterations:P.it,hash:'SHA-256'},
                                base,{name:'AES-GCM',length:256},false,['decrypt']);
      var buf=await C.decrypt({name:'AES-GCM',iv:bin(P.i)},key,bin(P.d));
      try{sessionStorage.setItem(KEY,pw)}catch(e){}
      open_(new TextDecoder().decode(buf));
      return true;
    }catch(e){
      try{sessionStorage.removeItem(KEY)}catch(_){}
      if(!quiet){
        m.className='msg err'; m.textContent="That's not the word. Try again.";
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
        i.value=''; i.focus();
      }
      return false;
    }
  }

  f.addEventListener('submit',async function(e){
    e.preventDefault();
    var pw=i.value.trim(); if(!pw){i.focus();return}
    b.disabled=true; i.disabled=true; m.className='msg'; m.textContent='Opening\u2026';
    await unlock(pw,false);
    b.disabled=false; i.disabled=false;
    if(m.className==='msg') m.textContent='';
  });

  var saved=null; try{saved=sessionStorage.getItem(KEY)}catch(e){}
  if(saved){ m.textContent='Opening\u2026'; unlock(saved,true).then(function(ok){ if(!ok) m.textContent=''; }); }
  else { setTimeout(function(){ i.focus(); },120); }
})();
</script>
</body>
</html>
