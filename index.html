<style>
:root{--canvas:#0b0b09;--canvas-line:#f2efe91f;--ink:#f2efe9;--ink-dim:#8f8c84;--gold:#c9a84c;--radius:2px;
  --font-display:"Archivo",sans-serif;--font-text:"Instrument Sans",sans-serif;--font-data:"Space Mono",monospace;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font-text);line-height:1.6;
  display:flex;flex-direction:column;justify-content:center;padding:0 16px;box-sizing:border-box}
main{max-width:30rem;margin:0 auto;width:100%}
a.logo-link{display:inline-flex;align-items:center;gap:11px;text-decoration:none;color:inherit;border-radius:var(--radius);
  transition:opacity .18s ease;padding:9px;margin:-9px}
a.logo-link:hover{opacity:.78}
a.logo-link:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
a.logo-link svg{width:32px;height:32px;display:block;pointer-events:none}
.n-stroke{stroke:var(--ink)} .n-dot{fill:var(--gold)}
a.logo-link:hover .n-stroke{stroke:var(--gold)}
.logo-word{font-family:var(--font-data);text-transform:uppercase;font-weight:700;font-size:.6875rem;letter-spacing:.14em}
h1{font-family:var(--font-display);text-transform:uppercase;letter-spacing:-.02em;font-weight:850;font-stretch:125%;
  line-height:.92;font-size:clamp(2rem,8vw,3rem);margin:2.5rem 0 1rem}
p{color:var(--ink-dim);margin:0}
p a{color:var(--gold)}
</style>
</head>
