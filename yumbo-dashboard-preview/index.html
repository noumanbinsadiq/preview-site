<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yumbo — how a job travels through the system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F6; --card:#FFFFFF; --ink:#0F1115; --ink2:#5B6270; --ink3:#8A919E;
  --line:#E3E7ED; --blue:#2563EB; --blue-soft:#EFF4FF;
  --coral:#FF5A38; --coral-soft:#FFF1ED;
  --green:#0F9D58; --green-soft:#E9F7EF;
  --amber:#D89A3C; --amber-soft:#FDF6E9;
  --r:14px; --r2:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit}
.appbar{background:#0F1115;color:#fff;padding:11px 16px;display:flex;align-items:center;
  gap:12px;position:sticky;top:0;z-index:40}
.appbar .brand{font-weight:800;letter-spacing:-.02em;font-size:17px}
.appbar .spacer{flex:1}
.whoami{background:rgba(255,255,255,.12);border:0;color:#fff;font:inherit;font-size:12.5px;
  font-weight:700;padding:9px 11px;border-radius:9px;min-height:40px}
.gear{width:40px;height:40px;min-width:40px;border-radius:50%;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;cursor:pointer;border:0;color:#fff}
.gear:hover{background:var(--blue)}
.gear.on{background:var(--blue)}
.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 8px;
  display:flex;gap:2px;overflow-x:auto;position:sticky;top:56px;z-index:30;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:0;border:0;font:inherit;font-size:13px;font-weight:700;color:var(--ink2);
  padding:14px 13px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;min-height:48px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .pipdot{display:inline-block;background:var(--coral);color:#fff;border-radius:99px;
  font-size:10.5px;font-weight:800;padding:1px 6px;margin-left:5px;vertical-align:1px}
main{padding:18px 16px 60px;max-width:1100px;margin:0 auto}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:15px;font-weight:800;margin:26px 0 10px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13.5px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tap{cursor:pointer;transition:border-color .14s,transform .12s}
.card.tap:hover{border-color:var(--blue);transform:translateY(-1px)}
.row{display:flex;gap:12px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi .l{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
.kpi .n{font-size:11.5px;color:var(--ink2);margin-top:2px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;
  letter-spacing:.02em;background:#EEF1F5;color:var(--ink2);white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.coral{background:var(--coral-soft);color:var(--coral)}
.pill.amber{background:var(--amber-soft);color:#9A6B14}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--blue);
  color:#fff;border:0;font:inherit;font-size:13.5px;font-weight:700;padding:12px 18px;
  border-radius:var(--r2);cursor:pointer;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.coral{background:var(--coral)}
.btn.sm{padding:9px 13px;font-size:12.5px;min-height:40px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:5px}
.in{width:100%;padding:12px;border:1px solid var(--line);border-radius:var(--r2);
  font:inherit;font-size:16px;background:#fff;min-height:46px}
.in:focus{outline:2px solid var(--blue);border-color:var(--blue)}
textarea.in{min-height:88px;resize:vertical}
.note{background:var(--blue-soft);border:1px solid #D6E4FF;border-radius:var(--r2);
  padding:12px 14px;font-size:13px;color:#1E3A8A;margin:12px 0}
.note.warn{background:var(--amber-soft);border-color:#F0DFBC;color:#7A5310}
.note.good{background:var(--green-soft);border-color:#C9E9D6;color:#0B6B3C}
.note.bad{background:var(--coral-soft);border-color:#FFD5CA;color:#A5321A}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:#0F1115;color:#fff;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  text-align:left;padding:11px 13px;white-space:nowrap}
td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:13.5px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:200px}
tr.tap{cursor:pointer}
tr.tap:hover{background:#F7F9FC}
tr.total td{font-weight:800;background:#FAFBFD;border-top:2px solid var(--ink)}
tr.dim td{color:var(--ink3);font-style:italic;background:#FAFBFD}
.in-money{color:var(--green);font-weight:800}
.out-money{color:var(--coral);font-weight:800}
.hint{font-size:11.5px;color:var(--ink3);padding:9px 13px;border-top:1px solid var(--line);background:#FAFBFD}
.chain{display:flex;gap:0;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.step{flex:0 0 auto;min-width:132px;background:#fff;border:1px solid var(--line);padding:12px;
  position:relative;cursor:pointer;transition:.14s}
.step:first-child{border-radius:var(--r) 0 0 var(--r)}
.step:last-child{border-radius:0 var(--r) var(--r) 0}
.step:hover{background:#F7F9FC}
.step.on{background:#0F1115;color:#fff;border-color:#0F1115}
.step .n{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ink3)}
.step.on .n{color:rgba(255,255,255,.55)}
.step .t{font-size:13px;font-weight:800;margin-top:3px}
.step .w{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.35}
.step.on .w{color:rgba(255,255,255,.7)}
.door{border-left:4px solid var(--blue)}
.door.b2{border-left-color:var(--green)}
.door.b3{border-left-color:var(--amber)}
.door.b4{border-left-color:var(--ink3)}
.avatar{width:38px;height:38px;min-width:38px;border-radius:50%;background:#0F1115;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.avatar.o{background:var(--coral)}
.tl{position:relative;padding-left:26px;margin:0}
.tl li{list-style:none;position:relative;padding:0 0 16px}
.tl li::before{content:"";position:absolute;left:-19px;top:5px;width:10px;height:10px;
  border-radius:50%;background:var(--blue)}
.tl li::after{content:"";position:absolute;left:-15px;top:17px;bottom:-3px;width:2px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.done::before{background:var(--green)}
.tl li.wait::before{background:#fff;border:2px solid var(--line)}
.tl .w{font-size:11.5px;color:var(--ink3)}
details.more{margin-top:10px}
details.more>summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;font-weight:800;color:var(--blue);padding:11px 0;min-height:44px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"▾";font-size:10px}
details.more[open]>summary::after{content:"▴"}
.banner{background:#0F1115;color:#fff;padding:9px 16px;font-size:12px;text-align:center}
.banner b{color:#FFB4A1}
.hide{display:none!important}
@media(max-width:640px){
  main{padding:16px 12px 60px}
  .tabs{top:54px}
  h1{font-size:19px}
  .kpi .v{font-size:21px}
  /* The "Viewing as…" select sizes itself to its LONGEST option, not the
     selected one, so at 390px it was 247px wide and pushed the gear 6px off
     the right edge — the whole page then scrolled sideways. Found by measuring
     which element overflowed rather than guessing at the tab bar, which
     scrolls inside itself and was innocent. */
  .whoami{max-width:44vw;min-width:0;text-overflow:ellipsis}
  .appbar{padding-left:12px;padding-right:12px;gap:8px}
  .appbar .brand{font-size:15px}
}
</style>
</head>
<body>

<div class="banner">Preview &middot; sample content, not real jobs or real money. <b>Nothing here is sent to anybody.</b></div>

<div class="appbar">
  <div class="brand">Yumbo</div>
  <div class="spacer"></div>
  <select class="whoami" id="who" aria-label="View as">
    <option value="owner">Viewing as: Mailin — Owner</option>
    <option value="secretary">Viewing as: Secretary</option>
    <option value="supervisor">Viewing as: Supervisor estimator</option>
    <option value="estimator">Viewing as: Estimator</option>
    <option value="pm">Viewing as: Project manager</option>
    <option value="sales">Viewing as: Sales</option>
  </select>
  <button class="gear" id="gearBtn" title="Settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.1"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</div>

<nav class="tabs" id="tabs"></nav>
<main id="view"></main>

<script>
/* ------------------------------------------------------------------
   Yumbo — click-through preview, v9.
   Everything below is in-memory sample data. No network, no storage.
------------------------------------------------------------------- */

var ROLES = {
  owner:     {name:'Mailin Quintana', short:'Owner',      tabs:['flow','intake','bids','quotes','jobs','money','people']},
  secretary: {name:'Secretary',       short:'Secretary',  tabs:['flow','intake','bids','quotes','jobs','money','people']},
  supervisor:{name:'Supervisor est.', short:'Supervisor', tabs:['flow','intake','bids','quotes','jobs']},
  estimator: {name:'Estimator',       short:'Estimator',  tabs:['flow','bids','quotes','jobs']},
  pm:        {name:'Project manager', short:'PM',         tabs:['flow','jobs']},
  sales:     {name:'Sales',           short:'Sales',      tabs:['flow','intake','bids','quotes','jobs']}
};
var MONEY_ROLES = ['owner','secretary','supervisor','pm','sales'];
var TAB_LABELS = {flow:'The chain', intake:'How work arrives', bids:'Bids', quotes:'Quotes',
                  jobs:'Jobs', money:'Money', people:'Settings'};

var state = {role:'owner', tab:'flow', open:null, step:0};

var BIDS = [
  {id:'B-118', prop:'Olympus Preserve at Town Center', who:'Rob (property manager)', via:'Request link',
   desc:'Aluminium fence fabrication and installation, pool deck side', got:'28 Aug', age:4, status:'Needs quoting'},
  {id:'B-119', prop:'Mirador Apartments', who:'Sandra, on-site manager', via:'Phone call',
   desc:'Two stair stringers cracked, building 4', got:'30 Aug', age:2, status:'Needs quoting'},
  {id:'B-120', prop:'Light House Condos', who:'Maintenance supervisor', via:'Email forwarded',
   desc:'Handrail replacement, three landings', got:'31 Aug', age:1, status:'Being priced'},
  {id:'B-121', prop:'Cape House', who:'Regional manager', via:'Request link',
   desc:'Concrete kit plates, walkway settling', got:'1 Sep', age:0, status:'Needs quoting'}
];

var LINES = [
  {d:'Aluminium picket fence, 6ft', qty:120, mat:14.50, hrs:0.35, sub:0,    eq:0},
  {d:'Gate, self-closing, welded',  qty:2,   mat:310.00, hrs:6.00, sub:0,    eq:0},
  {d:'Sub — RMC Solutions welding', qty:1,   mat:0,     hrs:0,    sub:2757.02, eq:0},
  {d:'Lift hire, 2 days',           qty:1,   mat:0,     hrs:0,    sub:0,    eq:120.00}
];
var PRICING = {labor:30, tax:7.5, profit:40, cont:5, gc:0};

var JOB = {
  no:'26-4611', prop:'Olympus Preserve at Town Center', desc:'Aluminium fence',
  price:8300, pm:'Carlos R.', est:'Alex M.', sales:'Dani P.', sub:'Rafa — RMC Solutions',
  started:'3 Sep', status:'In progress', pct:60
};
var COSTS = [
  {w:'Materials — Town &amp; County', d:'aluminium + tax', a:-1354.50, s:'bought'},
  {w:'Subcontractor — Rafa', d:'agreed payout', a:-2757.02, s:'paid in full'},
  {w:'Fuel', d:'on site', a:-250.20, s:'approved'},
  {w:'Crew lunch', d:'on site', a:-186.00, s:'approved'},
  {w:'Equipment hire', d:'lift, 2 days', a:-120.00, s:'approved'},
  {w:'Commission — Dani P.', d:'5% of job price', a:-415.00, s:'still moving'}
];

var INVOICES = [
  {no:'26-4611-D', job:'26-4611', prop:'Olympus Preserve', stage:'Deposit 35%', amt:2905.00, paid:2905.00,
   due:'10 Sep', state:'paid', promise:null, portal:'OPS Merchant'},
  {no:'26-4611-F', job:'26-4611', prop:'Olympus Preserve', stage:'Final', amt:5395.00, paid:2000.00,
   due:'8 Oct', state:'part', promise:'19 Sep — Rob said the rest goes out with the October run', portal:'OPS Merchant'},
  {no:'26-4590',   job:'26-4590', prop:'Mirador Apartments', stage:'Single', amt:1840.00, paid:0,
   due:'12 Aug', state:'late', promise:'8 Sep — accounts said the cheque is cut', portal:'VendorCafe'},
  {no:'26-4602',   job:'26-4602', prop:'Cape House', stage:'Single', amt:640.00, paid:0,
   due:'20 Sep', state:'open', promise:null, portal:'AvidXchange'}
];

var PEOPLE = [
  {n:'Mailin Quintana', r:'Owner', mgr:'—', tabs:'everything', o:true},
  {n:'Alex M.', r:'Secretary', mgr:'Mailin', tabs:'20 of 21'},
  {n:'Jorge S.', r:'Supervisor estimator', mgr:'Mailin', tabs:'13 of 21'},
  {n:'Carlos R.', r:'Project manager', mgr:'Jorge S.', tabs:'8 of 21'},
  {n:'Luis T.', r:'Estimator', mgr:'Jorge S.', tabs:'10 of 21'},
  {n:'Ana G.', r:'Estimator', mgr:'Jorge S.', tabs:'6 of 21'},
  {n:'Dani P.', r:'Sales', mgr:'Mailin', tabs:'6 of 21'}
];

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s)}
function money(n){return (n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function canMoney(){return MONEY_ROLES.indexOf(state.role)!==-1}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function priceLine(it){
  var matsBase=it.mat*it.qty, taxes=matsBase*(PRICING.tax/100), matsSub=matsBase+taxes;
  var labor=it.hrs*it.qty*PRICING.labor;
  var actual=matsSub+labor+it.sub+it.eq;
  var profit=actual*(PRICING.profit/100), cont=actual*(PRICING.cont/100), gc=actual*(PRICING.gc/100);
  return {actual:actual, taxes:taxes, labor:labor, profit:profit, cont:cont, gc:gc,
          sub:actual+gc+profit+cont};
}
function quoteTotals(){
  var t={cost:0,profit:0,cont:0,gc:0,total:0};
  LINES.forEach(function(l){var p=priceLine(l);
    t.cost+=p.actual;t.profit+=p.profit;t.cont+=p.cont;t.gc+=p.gc;t.total+=p.sub;});
  t.gross=t.total-t.cost;
  return t;
}

/* ---------- chrome ---------- */
function renderTabs(){
  var allowed=ROLES[state.role].tabs;
  if(allowed.indexOf(state.tab)===-1) state.tab=allowed[0];
  $('#tabs').innerHTML = allowed.map(function(t){
    var badge = (t==='bids') ? '<span class="pipdot">4</span>'
              : (t==='money' && canMoney()) ? '<span class="pipdot">2</span>' : '';
    return '<button data-tab="'+t+'" class="'+(state.tab===t?'on':'')+'">'+TAB_LABELS[t]+badge+'</button>';
  }).join('');
  $('#gearBtn').classList.toggle('on', state.tab==='people');
  $('#gearBtn').classList.toggle('hide', allowed.indexOf('people')===-1);
}

function go(tab, open){ state.tab=tab; state.open=open||null; render(); window.scrollTo(0,0); }

/* ---------- screens ---------- */
function scrFlow(){
  var steps=[
    ['01','Work arrives','A property asks for a price'],
    ['02','Logged as a bid','Ages red after 4 days'],
    ['03','Priced','Estimator builds the cost sheet'],
    ['04','Approved inside','Supervisor or Mailin says yes'],
    ['05','Quote sent','The property says yes or no'],
    ['06','Job created','Only this step makes a job'],
    ['07','Work happens','Updates, spend, subs'],
    ['08','Finished','Marked complete'],
    ['09','Invoiced','Deposit / progress / final'],
    ['10','Paid','Part, in full, or promised']
  ];
  var s=state.step;
  var detail=[
    'Four ways in — see <b>How work arrives</b>. Whichever door it comes through, it lands in one place so nothing is remembered only in somebody\'s inbox.',
    'Property, who asked, their contact, what they need, the date. It turns red after four days so an unanswered request cannot go quiet.',
    'The estimator opens the cost sheet: materials, labour hours, subcontractor, equipment. Profit and labour rate are set per job — 40% on welding, 25% on air conditioning.',
    'The supervisor estimator checks it, or Mailin does. They see the price <b>and</b> what it leaves her holding. Every version is kept.',
    'The quote goes to the property in the usual layout. Then it is out of our hands.',
    '<b>This is the only step in the whole system that creates a job.</b> Nothing else can. The property gives the job number here.',
    'The PM is asked for updates on a schedule Mailin sets. Fuel, lunch and tolls get tagged to this job, not to the office.',
    'Marked complete, with the date. That is what starts the invoice.',
    'Over $10,000 it starts with a 35% deposit. Otherwise one invoice. Goes out through the property\'s own portal.',
    'Paid in part, paid in full, or <b>promised for a date</b> — and a promise is chased if it passes.'
  ][s];

  return '<h1>How a job travels through the system</h1>'+
   '<p class="sub">Tap any step. This is the whole chain, start to finish.</p>'+
   '<div class="chain">'+steps.map(function(x,i){
     return '<div class="step '+(i===s?'on':'')+'" data-step="'+i+'"><div class="n">'+x[0]+
            '</div><div class="t">'+x[1]+'</div><div class="w">'+x[2]+'</div></div>';
   }).join('')+'</div>'+
   '<div class="card" style="margin-top:14px"><div class="pill blue">Step '+steps[s][0]+'</div>'+
   '<h2 style="margin:10px 0 6px">'+steps[s][1]+'</h2><div style="font-size:14px;color:var(--ink2)">'+detail+'</div></div>'+

   '<h2>Who does what</h2>'+
   '<div class="scrollx"><table><thead><tr><th>Step</th><th>Who</th><th>Why them</th></tr></thead><tbody>'+
   [['Log the bid','Secretary &middot; Sales &middot; Estimator &middot; Mailin','Whoever the request reaches first'],
    ['Price it','Estimator','Assigned when the bid is converted'],
    ['Approve it','Supervisor estimator &middot; Mailin','It commits the company, so it is a named permission'],
    ['Run the job','Project manager','On site, orders materials, answers the updates'],
    ['Invoice + chase','Secretary &middot; Mailin','Money screens are permission-gated'],
    ['Take the payment','Mailin','Bank details are hers alone and cannot be granted']
   ].map(function(r){return '<tr><td class="wrap"><b>'+r[0]+'</b></td><td class="wrap">'+r[1]+'</td><td class="wrap">'+r[2]+'</td></tr>'}).join('')+
   '</tbody></table><div class="hint">Scroll sideways for every column.</div></div>';
}

function scrIntake(){
  return '<h1>How work arrives</h1>'+
   '<p class="sub">Yumbo\'s clients are property managers. They email, they ring, they use their own portal. '+
   'All four routes end in the same place, so nothing lives only in one person\'s inbox.</p>'+

   '<div class="card door"><div class="row"><span class="pill blue">Door 1</span>'+
   '<b style="font-size:15px">The request link &mdash; recommended</b></div>'+
   '<p style="font-size:13.5px;color:var(--ink2);margin:9px 0 0">A short link Yumbo gives every property manager. '+
   'They fill it in themselves and it lands as a bid straight away, already spelled correctly. '+
   'No login, no app for them to learn. <b>Nobody at Yumbo has to type anything.</b></p>'+
   '<details class="more"><summary>See what they would fill in</summary>'+
   '<div class="grid" style="margin-top:10px">'+
     '<div><label class="f">Property</label><input class="in" value="Olympus Preserve at Town Center" readonly></div>'+

function render(){
  renderTabs();
  var v={flow:scrFlow,intake:scrIntake,bids:scrBids,quotes:scrQuotes,jobs:scrJobs,money:scrMoney,people:scrPeople};
  $('#view').innerHTML = (v[state.tab]||scrFlow)();
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab],[data-step],[data-go],[data-bid],[data-job],[data-inv],[data-demo]');
  if(!t) return;
  if(t.dataset.tab){ go(t.dataset.tab); return; }
  if(t.dataset.step!==undefined){ state.step=+t.dataset.step; render(); return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.bid){ go('bids',t.dataset.bid); return; }
  if(t.dataset.job){ go('jobs','1'); return; }
  if(t.dataset.inv){ state.open=t.dataset.inv; render(); return; }
  if(t.dataset.demo){
    var msg={req:'In the real system this lands on the bids board within a second.',
      meet:'A site meeting would be saved against this bid.',
      drop:'It would move to "not going ahead", with the reason kept.',
      newbid:'The add-a-bid form opens here.',
      approve:'This is the one action in the whole system that creates a job.',
      back:'It goes back to the estimator with your comment. The old version is kept.',
      ask:'They get it straight away. If they do not answer, they get chased.',
      spend:'It comes off this job\'s profit, not the office overhead.',
      done:'The job is marked finished and the invoice can go out.',
      pay:'The balance comes down and the payment is logged with who recorded it.',
      promise:'Saved. If the date passes with nothing paid, it lands on the call list.',
      save:'Their access changes immediately.',
      pw:'A one-time password appears once, to read to them.'}[t.dataset.demo];
    alert('Preview\n\n'+msg+'\n\nNothing was actually sent or saved.');
  }
});

$('#who').addEventListener('change',function(){ state.role=this.value; state.open=null; render(); window.scrollTo(0,0); });
$('#gearBtn').addEventListener('click',function(){ go('people'); });

render();
</script>
</body>
</html>
